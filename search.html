<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HNPES - Search on Hacker News</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; margin: 0; max-width: 640px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .logo { height: 40px; }
        #results { max-height: 70vh; overflow-y: auto; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .result-item { padding: 10px; margin: 10px 0; border-bottom: 1px solid #eee; }
        .result-title { font-weight: bold; margin-bottom: 5px; }
        .result-title a { color: #0077ff; }
        .result-details { font-size: 0.8em; color: #666; }
        .match-badge { font-size: 0.75em; margin-left: 6px; padding: 2px 6px; border-radius: 4px; background: #28a745; color: #fff; }
        .match-badge.same-domain { background: #6c757d; }
        .error { color: #dc3545; padding: 15px; }
        .retry-btn { margin-top: 10px; padding: 8px 14px; background: #ff6600; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hacker News Results</h1>
        <img class="logo" src="./icons/hn-logo-48x48.png" alt="">
    </div>
    <div id="results"></div>
    <script src="search.js"></script>
</body>
</html>
